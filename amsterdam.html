<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Proportional Map</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
    <script src="https://js.arcgis.com/4.28/"></script>

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>

    <script>
      require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/widgets/Legend"], (
        Map,
        MapView,
        FeatureLayer,
        Legend
      ) => {
        const defaultSym = {
  type: "simple-marker",
  color: [230, 120, 40, 0.8], // softer orange (less harsh)
  outline: {
    color: [50, 50, 50, 0.8],
    width: 1
  }
};
        /*****************************************************************
         * Set a size visual variable on the renderer. Size visual variables
         * create continuous ramps that map low data values to small icons
         * and high data values to large icons. Features
         * with data values in between the min and max data values are assigned
         * a size proportionally between the min and max sizes specified in
         * `minSize` and `maxSize` or `stops`.
         *****************************************************************/

        const renderer = {
          type: "simple", // autocasts as new SimpleRenderer()
          symbol: defaultSym,
          visualVariables: [
            {
              type: "size",
              field: "TOTPOP",
    
              legendOptions: {
                title: "Total Population"
              },
              stops: [
                {
                  value: 500,
                  size: 4,
                  label: "Low Population"
                },
                {
                  value: 3000,
                  size: 16,
                  label: "Mid Population"
                },
                {
                  value: 15000,
                  size: 30,
                  label: "High Population"
                }
              ]
            }
          ]
        };

        const povLayer = new FeatureLayer({
          url:
            "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/AmsterdamPopulation/FeatureServer/0",
          renderer: renderer,
          title: "Amsterdam Population",
          popupTemplate: {
            // autocasts as new PopupTemplate()
            title: "Location ID: {ID}",
            content: "Total Population: {TOTPOP}<br>This area contains {TOTPOP} people of people living in Amsterdam and the surrounding area.",
            fieldInfos: [
              {
                fieldName: "TOTPOP",
                format: {
                  digitSeparator: true,
                  places: 0
                }
              },
            ]
          }
        });

        const map = new Map({
          basemap:"gray-vector",
          layers: [povLayer]
        });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          center: [4.90, 52.37],
          zoom: 10
        });

        /******************************************************************
         *
         * Add layers to layerInfos on the legend
         *
         ******************************************************************/

        view.ui.add(
          new Legend({
            view: view
          }),
          "top-right"
        );
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
